name: diary_app
description: "一个支持日历视图的日记软件"
publish_to: 'none'
version: 2.1.0+2100

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  table_calendar: ^3.1.2  # 日历组件
  sqflite: ^2.3.3        # 本地数据库
  # sqflite_common_ffi: ^2.3.3  # 桌面平台支持（暂时禁用，避免GitHub下载问题）
  path_provider: ^2.1.4  # 文件路径
  image_picker: ^1.1.2   # 图片选择
  intl: ^0.19.0          # 日期格式化
  path: ^1.9.0           # 路径处理
  provider: ^6.1.2       # 状态管理
  shared_preferences: ^2.3.2  # 本地设置存储
  flutter_colorpicker: ^1.1.0  # 颜色选择器
  permission_handler: ^11.3.1  # 权限管理
  http: ^1.2.0  # HTTP请求
  archive: ^3.4.10  # ZIP解压
  file_picker: ^8.1.0  # 文件选择
  excel: ^4.0.6  # Excel 课表模板解析
  charset_converter: ^2.3.0  # GBK CSV 兼容（Excel 中文导出）
  flutter_secure_storage: ^9.2.2  # 安全存储
  encrypt: ^5.0.3  # 数据加密
  crypto: ^3.0.3  # 哈希计算
  clipboard: ^3.0.14  # 剪贴板功能
  turn_page_transition: ^0.3.0  # 书本翻页效果
  pdf: ^3.11.1  # PDF生成
  printing: ^5.13.1  # PDF打印/导出
  audioplayers: ^6.1.0  # 音效播放
  image: ^4.1.3  # 图片处理（缩略图生成）
  motion_photos: ^0.0.2  # Android Motion Photo 实况图片支持
  video_player: ^2.9.2  # 视频播放
  url_launcher: ^6.3.0  # URL启动器
  local_auth: ^3.0.1
  record: ^6.2.0
  flutter_local_notifications: ^17.2.4  # 浮窗系统通知
  timezone: ^0.9.4  # 课表课前提醒调度
  # 桌面小组件改为 App 模块内自绘 RemoteViews（android/app/src/main/kotlin/.../CourseWidget*）
  # 不再依赖 glance_widget：它的 Calendar 模板布局/文案写死（"+N more events"），
  # 且 updatePeriodMillis=0 → 跨天不刷新；它还有个「pub 缓存补丁会被 pub get 冲掉」的老坑
  device_info_plus: ^10.1.2  # 设备信息（权限判断用）
  visibility_detector: ^0.4.0  # 滚动可见性检测（ScrollReveal 组件）
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # flutter_launcher_icons: ^0.14.4  # 暂时禁用，镜像服务器问题

flutter:
  uses-material-design: true
  assets:
    - assets/images/splash_cover.png
    # === PDF中文字体（必须） ===
    # 字体来源: https://github.com/notofonts/noto-cjk/releases
    # 使用 NotoSerifCJKsc-VF（思源宋体可变字体）作为中文字体
    - assets/fonts/NotoSerifCJKsc-VF.ttf

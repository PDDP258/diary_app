[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diary-mcp"
version = "0.1.0"
description = "小记日记的 MCP 服务：让 MaiBot 能读用户的日记"
requires-python = ">=3.10"
dependencies = [
    # 刻意锁 v1：mcp 2.x 把 FastMCP 改名 MCPServer 且改了 API，
    # 而这里的目标是"能被 MaiBot 连上"，不是追新 SDK。
    "mcp>=1.2.0,<2",
    "cryptography>=42.0",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
diary-mcp = "diary_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["diary_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
